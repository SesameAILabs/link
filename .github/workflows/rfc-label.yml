name: rfc-label

# Labels pull requests that touch rfcs/ so they show up in the RFC list. It runs with the base
# repository's token on pull requests from forks, so it never checks out or runs their contents.
on:
  pull_request_target:
    types: [opened, reopened, synchronize]
    paths: ["rfcs/**"]

permissions:
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: gh pr edit "${PR}" --repo "${GITHUB_REPOSITORY}" --add-label rfc
