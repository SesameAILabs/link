name: Documentation problem
description: Something at link.sesame.com/docs is wrong, missing, or unclear.
labels: ["docs", "needs-triage"]
assignees: ["darkmirage"]
body:
  - type: input
    id: page
    attributes:
      label: Page
      placeholder: https://link.sesame.com/docs/quickstart/
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What's wrong
      description: Quote the text if you can, and say what you expected it to say.
    validations:
      required: true
