name: Question
description: How something works, or whether something is possible.
labels: ["question", "needs-triage"]
assignees: ["darkmirage"]
body:
  - type: markdown
    attributes:
      value: |
        The [documentation](https://link.sesame.com/docs/) answers most questions. Search it and [existing issues](https://github.com/SesameAILabs/link/issues?q=is%3Aissue) first.
  - type: textarea
    id: question
    attributes:
      label: Your question
    validations:
      required: true
