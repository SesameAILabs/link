name: Feature request
description: A small improvement or something Sesame Link should do.
labels: ["idea", "needs-triage"]
assignees: ["darkmirage"]
body:
  - type: markdown
    attributes:
      value: |
        For a larger change that needs a design, such as a new workflow, integration, or permission model, write an [RFC](https://github.com/SesameAILabs/link/blob/main/rfcs/README.md) instead.
  - type: textarea
    id: problem
    attributes:
      label: What you're trying to do
      description: The situation and what gets in the way today. This matters more than the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Web app
        - Voice calls
        - CLI
        - Menu-bar app
        - Claude Code
        - Codex
        - Pi
        - Something else
